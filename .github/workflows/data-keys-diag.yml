name: getData()が実際に返すキーを確認（送信なし）
on:
  workflow_dispatch:
    inputs:
      exclude:
        description: '除外キー（カンマ区切り）。空ならBQモードのフェーズ1既定'
        required: false
        default: 'media,deposit,dinii,予約,daily,PL'
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: dataKeysDiagを実行
        env:
          BQ_LOAD_TOKEN: ${{ secrets.BQ_LOAD_TOKEN }}
        run: |
          curl -sL -m 250 "https://script.google.com/macros/s/AKfycbz9rd37EZa6X8WRMVEBrXobN8DbYWkHRlhFNYU5rd1UZ0V8j0-6shMQjEeoi4HDWZ0B/exec?action=dataKeysDiag&token=$BQ_LOAD_TOKEN&exclude=${{ github.event.inputs.exclude }}" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.stringify(JSON.parse(d),null,2)));"
