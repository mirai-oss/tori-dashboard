name: getData()が実際に返すキーを確認（送信なし）
on:
  workflow_dispatch:
    inputs:
      exclude:
        description: '除外キー（カンマ区切り）。空ならBQモードのフェーズ1既定'
        required: false
        default: 'media,deposit,dinii,予約,daily,PL'
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: dataKeysDiagを実行
        env:
          BQ_LOAD_TOKEN: ${{ secrets.BQ_LOAD_TOKEN }}
          EXCLUDE_KEYS: ${{ github.event.inputs.exclude }}
        run: |
          curl -sL -m 250 -G "https://script.google.com/macros/s/AKfycbwW0qhyEr0-uQWTaLg7MkQhurHq6wMoaOKL7uCCnI_bgnAsGB5-auqG_dm_Q9uJc3Kc/exec" \
            --data-urlencode "action=dataKeysDiag" \
            --data-urlencode "token=$BQ_LOAD_TOKEN" \
            --data-urlencode "exclude=$EXCLUDE_KEYS" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.stringify(JSON.parse(d),null,2)));"
