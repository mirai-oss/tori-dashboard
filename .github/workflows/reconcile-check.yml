name: シートとBQの突合を確認（送信なし）
# タスク3（実装指示書_ダッシュボード高速化）の前提条件①の裏付け用。
# bqSyncSales/bq-sales-reconcileが毎日使っている突合ロジック(bqReconcileSales)を手動で叩くだけ。
on:
  workflow_dispatch:
    inputs:
      days:
        description: '直近何日分を突合するか（既定35日）'
        required: false
        default: '35'
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: bqReconcileSalesを実行
        env:
          BQ_LOAD_TOKEN: ${{ secrets.BQ_LOAD_TOKEN }}
          DAYS: ${{ github.event.inputs.days }}
        run: |
          curl -sL -G "https://script.google.com/macros/s/AKfycbz9rd37EZa6X8WRMVEBrXobN8DbYWkHRlhFNYU5rd1UZ0V8j0-6shMQjEeoi4HDWZ0B/exec" \
            --data-urlencode "action=bqReconcileSales" \
            --data-urlencode "token=$BQ_LOAD_TOKEN" \
            --data-urlencode "days=$DAYS" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.stringify(JSON.parse(d),null,2)));"
