name: 朝の見張り番（売上・勤怠の取込確認）

# ns-portal担当D（docs/実装指示書_担当D_勤怠給与監視_2026-08-24.md D-3）。
# 8/23の「Mac mini停止に半日気づけなかった」障害の再発防止策。GitHub Actions（Mac miniと
# 独立した場所）から、毎朝「昨日分の売上・勤怠がちゃんと入っているか」を確認し、
# 入っていない時だけSlack（#本部-開発システム）へ警告する（正常時は無送信）。※2026-11-11 Lark送信は廃止。
#
# 既存ファイル・app.js・GASは一切変更しない（新規ファイル追加のみ。担当A専任のため）。
# 売上チェックは既存のGASアクション`reportDataBQ`（bq-diag.ymlと同じ軽量問い合わせパターン）を
# そのまま流用。勤怠チェックはns-portal側の新規Edge Function`attendance-freshness-check`を、
# tori-dashboard⇔ns-portal間で既に共有されている`BQ_LOAD_TOKEN`で呼ぶ（新しいシークレットは増やさない）。
#
# 発火は他のcron系workflowと同じく外部cron（cron-job.org）からworkflow_dispatch APIを叩く。
#   POST https://api.github.com/repos/mirai-oss/tori-dashboard/actions/workflows/morning-watchdog.yml/dispatches
#   body: {"ref":"main"}
#   Schedule: 毎日 09:30 JST（売上・勤怠とも当日08:00台の同期が終わっている前提の時刻）
#
# 手動実行: GitHubの Actions タブ → 本workflow → Run workflow でも実行可能
on:
  workflow_dispatch:
    inputs:
      date:
        description: '確認したい日付（YYYY-MM-DD。空欄なら昨日=JST）'
        required: false
        default: ''

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 対象日を決定（JST基準の昨日）
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            TARGET="${{ github.event.inputs.date }}"
          else
            TARGET=$(TZ=Asia/Tokyo date -d 'yesterday' +%Y-%m-%d)
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "対象日: $TARGET"

      - name: 売上（fact_daily_store）を確認
        id: sales
        env:
          BQ_LOAD_TOKEN: ${{ secrets.BQ_LOAD_TOKEN }}
        run: |
          if [ -z "$BQ_LOAD_TOKEN" ]; then
            echo "::warning::BQ_LOAD_TOKEN未設定のため売上チェックをスキップ"
            echo "missing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RES=$(curl -s -L -G "https://script.google.com/macros/s/AKfycbwW0qhyEr0-uQWTaLg7MkQhurHq6wMoaOKL7uCCnI_bgnAsGB5-auqG_dm_Q9uJc3Kc/exec" \
            --data-urlencode "action=reportDataBQ" \
            --data-urlencode "token=$BQ_LOAD_TOKEN" \
            --data-urlencode "kind=daily" \
            --data-urlencode "date=${{ steps.date.outputs.target }}")
          echo "$RES"
          OK=$(echo "$RES" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).ok)}catch(e){console.log('false')}})")
          if [ "$OK" != "true" ]; then
            echo "::warning::reportDataBQ取得に失敗（判定不能のため異常とはみなさない）"
            echo "missing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ROWS=$(echo "$RES" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log((JSON.parse(d).rows||[]).length)}catch(e){console.log(0)}})")
          if [ "$ROWS" -eq "0" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 勤怠（labor_cost_daily）を確認
        id: attendance
        env:
          BQ_LOAD_TOKEN: ${{ secrets.BQ_LOAD_TOKEN }}
        run: |
          if [ -z "$BQ_LOAD_TOKEN" ]; then
            echo "::warning::BQ_LOAD_TOKEN未設定のため勤怠チェックをスキップ"
            echo "missing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RES=$(curl -s "https://uuvsxzhpxtghojoubjcc.supabase.co/functions/v1/attendance-freshness-check?token=$BQ_LOAD_TOKEN&date=${{ steps.date.outputs.target }}")
          echo "$RES"
          OK=$(echo "$RES" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).ok)}catch(e){console.log('false')}})")
          if [ "$OK" != "true" ]; then
            echo "::warning::attendance-freshness-check取得に失敗（判定不能のため異常とはみなさない）"
            echo "missing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HAS=$(echo "$RES" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).hasData)}catch(e){console.log('true')}})")
          if [ "$HAS" != "true" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 店舗名ゲートウェイの未解決件数を確認（kd_unresolved_names）
        # 2026-09-02追加（設計書_表示集計層kdと高速化実行計画_2026-09-02.md §5・§10.2-5・担当D）。
        # ns-daily-import等の取込ジョブがstore_aliasesに無い店舗名を検知するとkd_unresolved_names
        # へ隔離する（店舗名ゲートウェイ原則）。ここが増え続けている＝どこかの店舗の取込データが
        # 静かに欠落し続けている合図なので、他の2チェックと同じく「無視できない件数の時だけ」警告する。
        id: unresolved
        env:
          BQ_LOAD_TOKEN: ${{ secrets.BQ_LOAD_TOKEN }}
        run: |
          if [ -z "$BQ_LOAD_TOKEN" ]; then
            echo "::warning::BQ_LOAD_TOKEN未設定のためkd_unresolvedチェックをスキップ"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RES=$(curl -s "https://uuvsxzhpxtghojoubjcc.supabase.co/functions/v1/kd-unresolved-check?token=$BQ_LOAD_TOKEN")
          echo "$RES"
          OK=$(echo "$RES" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).ok)}catch(e){console.log('false')}})")
          if [ "$OK" != "true" ]; then
            echo "::warning::kd-unresolved-check取得に失敗（判定不能のため異常とはみなさない）"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(echo "$RES" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).openCount||0)}catch(e){console.log(0)}})")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      # 2026-11-11（ユーザー決定「正常の報告は出さない」）: 売上・勤怠の取込が欠けているときだけ送る。
      #   未解決の店舗名の件数だけでは送らない（その件数は keiei-kd-refresh の通知で別に出ている。欠けの通知には今までどおり書き添える）。監視そのものは毎朝動く。
      - name: Slackへ警告（売上・勤怠の取込が欠けている時だけ・正常時は無送信）
        if: steps.sales.outputs.missing == 'true' || steps.attendance.outputs.missing == 'true'
        env:
          NOTIFY_SLACK_SECRET: ${{ secrets.NOTIFY_SLACK_SECRET }}
        run: |
          PARTS=""
          if [ "${{ steps.sales.outputs.missing }}" = "true" ]; then PARTS="売上"; fi
          if [ "${{ steps.attendance.outputs.missing }}" = "true" ]; then
            if [ -n "$PARTS" ]; then PARTS="$PARTS・勤怠"; else PARTS="勤怠"; fi
          fi
          TEXT="⚠️ ${{ steps.date.outputs.target }} の取込が確認できません（${PARTS}）。Mac mini停止・cron失敗等の可能性があります。"
          if [ -z "$PARTS" ]; then
            TEXT="✅ ${{ steps.date.outputs.target }} の売上・勤怠取込は正常です。"
          fi
          COUNT="${{ steps.unresolved.outputs.count }}"
          if [ "$COUNT" != "0" ] && [ -n "$COUNT" ]; then
            TEXT="${TEXT}$(printf '\n⚠️ 店舗名ゲートウェイで保留中のデータが %s 件あります（未知の店舗名でstore_aliasesに未登録のため取込を保留中）。store_aliasesへ登録すると自動的に解消します。' "$COUNT")"
          fi
          # Slack #本部-開発システム へ送信（ns-portal notify-slack 経由・台帳に残る）。2026-11-11 Lark 送信は廃止（Slack 一本化）。
          # 送信できなかったとき（秘密未設定・HTTP非200）はジョブを失敗にして気づけるようにする（Lark廃止後は黙って素通りしないため）
          if [ -z "$NOTIFY_SLACK_SECRET" ]; then
            echo "::error::NOTIFY_SLACK_SECRET 未設定のため Slack へ送信できません"
            exit 1
          fi
          SBODY=$(TEXT="$TEXT" node -e "console.log(JSON.stringify({action:'send',channel_key:'hq.dev_system',text:process.env.TEXT,source:'tori-dashboard',event:'morning_watchdog',username:'監視'}))")
          SRES=$(curl -s -w "\n%{http_code}" -X POST "https://uuvsxzhpxtghojoubjcc.supabase.co/functions/v1/notify-slack" -H "Content-Type: application/json" -H "x-notify-secret: $NOTIFY_SLACK_SECRET" -d "$SBODY")
          SCODE=$(echo "$SRES" | tail -1)
          if [ "$SCODE" != "200" ]; then
            echo "::error::Slack送信に失敗しました（HTTP $SCODE）"
            exit 1
          fi
          echo "slack: sent"
