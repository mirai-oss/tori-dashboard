name: 運営委託費PL自動連携（精算ダッシュボード→PL）
# 精算対象(stores.seisan_target)の店舗について、精算ダッシュボードの業務委託費（税抜）を
# 経営ダッシュボードのPL（DB_PL）へ自動反映する。
#
# 毎週月曜9:00 JSTに自動実行し、直近3ヶ月分（今月・先月・先々月）をまとめて再同期する。
# 精算書の発行が月末から数週間遅れることがある点と、発行済みの精算書が後日修正される
# ことがある点の両方に対応するため、「今月分だけ」ではなく直近3ヶ月を毎回取り直す
# （syncSeisanFeeToPlは対象月×対象店舗の自動計上行を毎回まるごと差し替える設計なので、
#  同じ月を何度実行しても安全＝金額が変わっていれば新しい値に上書きされる）。
#
# 手動実行時は対象月を1つだけ指定できる（過去分の反映・特定月の再確認用）。
on:
  schedule:
    - cron: '0 0 * * 1'   # 毎週月曜 9:00 JST（UTC 0:00）
  workflow_dispatch:
    inputs:
      ym:
        description: '対象月（YYYY-MM）。空欄なら直近3ヶ月をまとめて実行'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 対象月を決める
        id: months
        run: |
          if [ -n "${{ github.event.inputs.ym }}" ]; then
            echo "list=${{ github.event.inputs.ym }}" >> "$GITHUB_OUTPUT"
          else
            m0=$(date -u +%Y-%m)
            m1=$(date -u -d "$m0-01 -1 month" +%Y-%m)
            m2=$(date -u -d "$m0-01 -2 month" +%Y-%m)
            echo "list=$m0,$m1,$m2" >> "$GITHUB_OUTPUT"
          fi

      - name: syncSeisanFeeToPlを対象月ごとに実行
        env:
          BQ_LOAD_TOKEN: ${{ secrets.BQ_LOAD_TOKEN }}
        run: |
          # 2026-09-19追加: GAS Webアプリの一時的な不調（Googleボット判定でHTMLページが返り、
          # JSON.parseがそのまま例外でジョブ全体を落とす）に対応。seisan-category-pl-sync.ymlの
          # 2026-09-14実害（この不調で1ヶ月失敗→ループごと打ち切り→残りの月が1週間未同期のまま
          # 放置）と同じ構造の脆弱性がこちらにもあったため、同じリトライ＋継続方式を適用する。
          call_gas() {
            local url="$1" attempt body
            for attempt in 1 2 3 4 5; do
              body=$(curl -sL "$url") || body=""
              if echo "$body" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{JSON.parse(d);process.exit(0)}catch(e){process.exit(1)}});" 2>/dev/null; then
                echo "$body" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.stringify(JSON.parse(d),null,2)));"
                return 0
              fi
              echo "::warning::${ym}: 有効なJSONが返りませんでした(試行${attempt}/5)。$([ $attempt -lt 5 ] && echo 'リトライします' || echo '諦めます')"
              [ $attempt -lt 5 ] && sleep $((attempt * 5))
            done
            echo "::error::${ym}: 5回リトライしても失敗しました"
            return 1
          }
          IFS=',' read -ra YMS <<< "${{ steps.months.outputs.list }}"
          failed=0
          for ym in "${YMS[@]}"; do
            echo "::group::$ym"
            call_gas "https://script.google.com/macros/s/AKfycbwW0qhyEr0-uQWTaLg7MkQhurHq6wMoaOKL7uCCnI_bgnAsGB5-auqG_dm_Q9uJc3Kc/exec?action=syncSeisanFeeToPl&token=$BQ_LOAD_TOKEN&ym=$ym" || failed=1
            echo "::endgroup::"
          done
          if [ "$failed" = "1" ]; then
            echo "::error::一部の月が同期できませんでした。ワークフローの実行ログを確認してください"
            exit 1
          fi
