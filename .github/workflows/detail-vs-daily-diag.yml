name: 明細分析とダッシュボードの売上・客数差を突合（送信なし）
on:
  workflow_dispatch:
    inputs:
      ym:
        description: '対象月（YYYY-MM）'
        required: true
        default: '2026-06'
      store:
        description: '確認したい店舗名（1つ。空なら全店合計）'
        required: false
        default: ''

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: detailVsDailyDiagを実行
        env:
          BQ_LOAD_TOKEN: ${{ secrets.BQ_LOAD_TOKEN }}
          YM: ${{ github.event.inputs.ym }}
          STORE: ${{ github.event.inputs.store }}
        run: |
          curl -sL -G "https://script.google.com/macros/s/AKfycbwW0qhyEr0-uQWTaLg7MkQhurHq6wMoaOKL7uCCnI_bgnAsGB5-auqG_dm_Q9uJc3Kc/exec" \
            --data-urlencode "action=detailVsDailyDiag" \
            --data-urlencode "token=$BQ_LOAD_TOKEN" \
            --data-urlencode "ym=$YM" \
            --data-urlencode "store=$STORE" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.stringify(JSON.parse(d),null,2)));"
