name: Lark自動レポート（日報・週報・月報）

# 発火は「外部cron（cron-job.org 等）」から workflow_dispatch API を叩いて行う。
#   POST https://api.github.com/repos/<repo>/actions/workflows/lark-report.yml/dispatches
#   body: {"ref":"main","inputs":{"kind":"daily"}}   （kind = daily / weekly / monthly）
# GitHub内蔵の schedule: は時刻が数十分〜数時間ずれる（無料/publicの仕様）ため使わない。
# ※どうしても手が空かない時の予備として、下の schedule: をコメント解除すれば併用も可能
#   （ただし遅延発火で二重送信になりうる点に注意）。
on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'レポート種別'
        required: true
        default: 'daily'
        type: choice
        options: [daily, weekly, monthly]
      # ▼ 失敗した1店舗だけを再送したい時に使う（通常の定時配信では空のまま）。
      #   only_group を指定すると「全体レポート(report job)」は送らず、そのグループだけを配信する。
      #   例) only_group=group1 / only_stores=鳥一代 新橋|shinbashi
      only_group:
        description: '再送するグループのみ実行（例 group1／空=全グループ＋全体レポート）'
        required: false
        default: ''
        type: string
      only_stores:
        description: '再送する店舗のみ（例 鳥一代 新橋|shinbashi／空=そのグループの全店舗）'
        required: false
        default: ''
        type: string
  # schedule:
  #   - cron: '0 3 * * *'             # 日報 12:00 JST（予備・遅延あり）
  #   - cron: '10 3 1,8,15,22,29 * *' # 週報（予備）
  #   - cron: '20 3 1 * *'            # 月報（予備）

permissions:
  contents: write   # 画像をGitHub Releaseにアップロードするため

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # only_group を指定した「1店舗だけ再送」の時は、全体レポートを二重送信しないようスキップ
    if: ${{ github.event.inputs.only_group == '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 設定チェック（未設定ならスキップ）
        run: |
          if [ -z "${{ secrets.LARK_WEBHOOK }}" ] || [ -z "${{ secrets.BQ_LOAD_TOKEN }}" ]; then
            echo "::notice::LARK_WEBHOOK / BQ_LOAD_TOKEN が未設定のためスキップ（Lark日報設定.md 参照）"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: レポート種別を決定
        if: env.SKIP != '1'
        run: |
          K="${{ github.event.inputs.kind }}"
          if [ -z "$K" ]; then
            case "${{ github.event.schedule }}" in
              '0 3 * * *') K=daily ;;
              '10 3 1,8,15,22,29 * *') K=weekly ;;
              '20 3 1 * *') K=monthly ;;
              *) K=daily ;;
            esac
          fi
          echo "REPORT_KIND=$K" >> "$GITHUB_ENV"
          echo "kind=$K"

      - name: 日報の数値を取得（BigQuery・ブラウザ操作なし）
        if: env.SKIP != '1'
        env:
          REPORT_KIND: ${{ env.REPORT_KIND }}
          BQ_LOAD_TOKEN: ${{ secrets.BQ_LOAD_TOKEN }}
        run: node scripts/lark-report.mjs capture-bq

      - name: Lark にカード送信（要約テキスト）
        if: env.SKIP != '1'
        env:
          REPORT_KIND: ${{ env.REPORT_KIND }}
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
        run: node scripts/lark-report.mjs send

      # ================= 第2レポート: 鳥一代グループ8店舗のみ =================
      # 別のLarkグループへ、対象店舗を絞った日報を送る（LARK_WEBHOOK2 が未設定ならスキップ）
      - name: 第2レポートの設定チェック
        if: env.SKIP != '1'
        run: |
          if [ -z "${{ secrets.LARK_WEBHOOK2 }}" ]; then
            echo "::notice::LARK_WEBHOOK2 未設定のため第2レポート（店舗絞り込み）はスキップ"
            echo "SKIP2=1" >> "$GITHUB_ENV"
          fi

      - name: 第2レポートの数値を取得（8店舗・BigQuery）
        if: env.SKIP != '1' && env.SKIP2 != '1'
        env:
          REPORT_KIND: ${{ env.REPORT_KIND }}
          BQ_LOAD_TOKEN: ${{ secrets.BQ_LOAD_TOKEN }}
          REPORT_GROUP: tori
          REPORT_STORES: 芝の鳥一代,鳥一代 はなれ,鳥一代 恵比寿,鳥一代 新橋,鳥一代 本店,鶏武者 新横浜,鶏武者 川崎店,黒霧屋 新横浜
        run: node scripts/lark-report.mjs capture-bq

      - name: 第2レポートを Lark に送信
        if: env.SKIP != '1' && env.SKIP2 != '1'
        env:
          REPORT_KIND: ${{ env.REPORT_KIND }}
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK2 }}
        run: node scripts/lark-report.mjs send

      - name: スクリーンショットを保存（確認用）
        if: always() && env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ env.REPORT_KIND }}-${{ github.run_id }}
          path: report.png
          if-no-files-found: ignore
          retention-days: 14

  # ================= 配信matrixの動的生成（Day6③。データ基盤統合ロードマップDay6） =================
  # グループ／店舗の割り当てはSupabase（report_channels・report_channel_stores、正本はnippo店舗管理画面の
  # 「配信グループ管理」）から毎回読み直す。コミット不要・グループ追加はnippo画面で完結する。
  # anonキーで読める匿名読み取り専用VIEW(report_channel_matrix_v)を使うため、GitHub Secretの追加は不要。
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: レポート種別を決定
        run: |
          K="${{ github.event.inputs.kind }}"
          [ -z "$K" ] && K=daily
          echo "REPORT_KIND=$K" >> "$GITHUB_ENV"
      - name: 配信matrixをSupabaseから取得
        id: build
        env:
          REPORT_KIND: ${{ env.REPORT_KIND }}
        run: |
          set -e
          KEY='sb_publishable_MrwPJAx_Ws_fdRutprKCiQ_dg3wCiTr'
          URL="https://uuvsxzhpxtghojoubjcc.supabase.co/rest/v1/report_channel_matrix_v?select=*&report_kinds=cs.%7B${REPORT_KIND}%7D"
          RES=$(curl -sf "$URL" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "取得: $RES"
          MATRIX=$(node -e '
            const rows = JSON.parse(process.argv[1]);
            const include = rows.map(r => ({
              group: r.group, kind: r.kind, secret: r.secret_name,
              room: r.chatwork_room_id || "", stores: r.stores, useBq: "1",
            }));
            console.log(JSON.stringify({ include }));
          ' "$RES")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # ================= グループ別レポート（配信グループごとに、担当店舗を1店舗ずつ送る） =================
  # 店舗を1つだけ渡すと、店舗比較表ではなく「直近推移＋ランチ/ディナー内訳＋媒体別売上」の
  # 単店舗フォーマットになる（app.js の viewReport が自動で切り替える）。
  # 1グループにつき、担当店舗の枚数ぶんカードが連続して届く（まとめて1枚にはしない）。
  #
  # ▼ グループの追加/変更/Lark⇔Chatwork切替は、コード変更不要・nippoの店舗管理画面
  #   「配信グループ管理」で行う（Day6③。matrixは上のprepareジョブが毎回Supabaseから動的生成する）。
  #   Secretの名前だけをそこで登録し（値はDBに置かない）、実際のWebhook URL／APIトークンは
  #   GitHub → Settings → Secrets and variables → Actions に登録する。
  #   Secret が未登録のグループは自動でスキップされる。別グループに同じ店舗が入っていてもよい。
  group-report:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false    # 1グループ失敗しても他グループの配信は続行する
      max-parallel: 1     # ダッシュボード(GAS)への同時ログインを避けるため1グループずつ
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 設定チェック（Secret未登録ならスキップ）
        env:
          HOOK: ${{ secrets[matrix.secret] }}
          BQT: ${{ secrets.BQ_LOAD_TOKEN }}
          ONLY_GROUP: ${{ github.event.inputs.only_group }}
          ONLY_STORES: ${{ github.event.inputs.only_stores }}
        run: |
          if [ -n "$ONLY_GROUP" ] && [ "$ONLY_GROUP" != "${{ matrix.group }}" ]; then
            echo "::notice::only_group=$ONLY_GROUP のため ${{ matrix.group }} はスキップ"
            echo "SKIP=1" >> "$GITHUB_ENV"
          elif [ -z "$HOOK" ]; then
            echo "::notice::${{ matrix.secret }} が未登録のため ${{ matrix.group }} はスキップ"
            echo "SKIP=1" >> "$GITHUB_ENV"
          elif [ -z "$BQT" ]; then
            echo "::notice::BQ_LOAD_TOKEN が未設定のためスキップ"
            echo "SKIP=1" >> "$GITHUB_ENV"
          elif [ "${{ matrix.kind }}" = "chatwork" ] && [ -z "${{ matrix.room }}" ]; then
            echo "::notice::${{ matrix.group }} はChatworkルームIDが未設定のためスキップ"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
          # 店舗を絞る指定があればそれを使う（無ければmatrixの全店舗）
          if [ -n "$ONLY_STORES" ]; then
            echo "::notice::店舗を絞って実行: $ONLY_STORES"
            echo "STORES_OVERRIDE=$ONLY_STORES" >> "$GITHUB_ENV"
          fi

      - name: レポート種別を決定
        if: env.SKIP != '1'
        run: |
          K="${{ github.event.inputs.kind }}"
          [ -z "$K" ] && K=daily
          echo "REPORT_KIND=$K" >> "$GITHUB_ENV"

      - name: 店舗ごとに生成して送信
        if: env.SKIP != '1'
        env:
          REPORT_KIND: ${{ env.REPORT_KIND }}
          BQ_LOAD_TOKEN: ${{ secrets.BQ_LOAD_TOKEN }}
          CHANNEL_KIND: ${{ matrix.kind }}
          LARK_WEBHOOK: ${{ secrets[matrix.secret] }}
          CHATWORK_TOKEN: ${{ secrets[matrix.secret] }}
          CHATWORK_ROOM_ID: ${{ matrix.room }}
          STORES: ${{ matrix.stores }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          OK=0; FAIL=0; FAILED=""
          # only_stores 指定があればそちらを優先（1店舗だけ再送する時に使う）
          [ -n "${STORES_OVERRIDE:-}" ] && STORES="$STORES_OVERRIDE"
          IFS=',' read -ra ENTRIES <<< "$STORES"
          for entry in "${ENTRIES[@]}"; do
            STORE="${entry%%|*}"
            KEY="${entry##*|}"
            echo "::group::$STORE"

            # 2026-08-23: 媒体別日次の肥大化でブラウザ経由のcaptureがGASの読込待ちに詰まる
            # 問題（2026-08-22発覚）への根本対応として、ログイン・ブラウザ操作を使わない
            # capture-bq（BigQueryから数字だけ取得）に切替。report.pngは作られない
            # （Larkは画像リンク無し・Chatworkはテキストのみで送られる。下のアップロード
            # 手順はreport.pngが存在する時だけ実行される）。
            rm -f report.png report-meta.json
            CAPTURED=0
            for try in 1 2; do
              if REPORT_STORES="$STORE" REPORT_GROUP="$KEY" node scripts/lark-report.mjs capture-bq; then
                CAPTURED=1; break
              fi
              if [ "$try" -lt 2 ]; then
                echo "::notice::$STORE の数値取得に失敗（$try/2）。20秒待って再試行します"
                sleep 20
              fi
            done
            if [ "$CAPTURED" != "1" ]; then
              echo "::warning::$STORE の数値取得に失敗"
              FAIL=$((FAIL+1)); FAILED="$FAILED $STORE"; echo "::endgroup::"; continue
            fi

            # 生成物が本当にこの店舗のものか検証してから送る（取り違え防止）
            if ! FILEKEY=$(STORE_CHECK="$STORE" node -e "
              const d=require('./report-meta.json');
              if(d.singleStore!==process.env.STORE_CHECK){ console.error('店舗不一致: '+d.singleStore); process.exit(1); }
              console.log(d.fileKey);
            "); then
              echo "::warning::$STORE のメタ検証に失敗"
              FAIL=$((FAIL+1)); FAILED="$FAILED $STORE"; echo "::endgroup::"; continue
            fi

            if [ "$CHANNEL_KIND" = "chatwork" ]; then
              # Chatworkはreport.pngがあればそのまま添付する（無ければテキストのみ。Day6③）
              if node scripts/lark-report.mjs send; then
                echo "$STORE ✓ 送信完了"; OK=$((OK+1))
              else
                echo "::warning::$STORE の送信に失敗"
                FAIL=$((FAIL+1)); FAILED="$FAILED $STORE"
              fi
              echo "::endgroup::"; continue
            fi

            IMG_URL=""
            if [ -f report.png ]; then
              cp report.png "$FILEKEY.png"
              gh release view reports >/dev/null 2>&1 || gh release create reports --title "自動レポート画像" --notes "日報/週報/月報の画像置き場（自動更新）"
              if ! gh release upload reports "$FILEKEY.png" --clobber; then
                echo "::warning::$STORE の画像アップロードに失敗"
                rm -f "$FILEKEY.png"; FAIL=$((FAIL+1)); FAILED="$FAILED $STORE"; echo "::endgroup::"; continue
              fi
              rm -f "$FILEKEY.png"
              IMG_URL="https://github.com/$REPO/releases/download/reports/$FILEKEY.png"
            fi

            if IMAGE_URL="$IMG_URL" node scripts/lark-report.mjs send; then
              echo "$STORE ✓ 送信完了"; OK=$((OK+1))
            else
              echo "::warning::$STORE の送信に失敗"
              FAIL=$((FAIL+1)); FAILED="$FAILED $STORE"
            fi
            echo "::endgroup::"
          done

          echo "::notice::${{ matrix.group }} 結果: 成功 $OK 件 / 失敗 $FAIL 件"
          # 1店舗でも失敗したらジョブを失敗させる（黙って欠落させない）
          if [ "$FAIL" -gt 0 ]; then
            echo "::error::${{ matrix.group }} で $FAIL 件送信できませんでした:$FAILED"
            exit 1
          fi
